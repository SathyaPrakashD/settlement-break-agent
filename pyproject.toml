[project]
name = "settlement-break-agent"
version = "0.1.0"
description = "Production-grade retrieval system for financial settlement break investigation. RAG-first foundation that grows into a LangGraph + MCP agent."
authors = [{ name = "Sathya Prakash D" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    # Data
    "faker>=30.0.0",
    "pandas>=2.2.0",
    # Retrieval
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.1.0",  # bge embeddings + reranker
    "rank-bm25>=0.2.2",
    # LLM
    "google-genai>=0.3.0",  # Gemini structured output
    # Utilities
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
sba = "sba.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sba"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF002"]  # line length handled by formatter; ambiguous unicode is fine in comments

[tool.ruff.lint.per-file-ignores]
"src/sba/cli.py" = ["B008"]  # Typer uses Option() in defaults by convention
"src/sba/synthesis/synthesizer.py" = ["F841"]  # stub has unused vars intentionally

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/sba --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
